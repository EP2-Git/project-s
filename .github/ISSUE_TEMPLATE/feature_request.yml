name: Feature request
description: Propose a focused improvement after checking Discussions and the public roadmap.
title: "[Feature]: "
labels: ["type: feature", "priority: p2"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome and non-AI fallback.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Most relevant area
      description: Maintainers will apply the matching area label during triage.
      options:
        - Authority or confirmation
        - Scheduling
        - Database or RLS
        - HTTP API
        - TypeScript SDK
        - MCP adapter
        - Web application
        - Accessibility
        - Developer experience
        - Security
        - Documentation
        - Release or community
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and scheduling boundaries
      description: Note public-data, RLS, timezone, conflict, integration, and privacy implications.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should this proposal deliberately not change?
    validations:
      required: true
  - type: checkboxes
    id: core_authority
    attributes:
      label: Core authority check
      options:
        - label: This proposal keeps consequential scheduling authority and correctness in Project S Core rather than a UI, model, transport, or Cloud-only path.
          required: true
