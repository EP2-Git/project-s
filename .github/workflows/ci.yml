name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality and current-tree safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: project-s-ci-public-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Install verified Deno for Edge checks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/project-s-deno-2.9.8.zip"
          destination="$RUNNER_TEMP/project-s-deno-2.9.8"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
          printf '%s  %s\n' 'e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609' "$archive" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Verify Node and Edge migration parity
        run: npm run test:parity:edge
      - name: Check the complete Edge entrypoint
        run: deno check --no-lock --node-modules-dir=none --config=supabase/functions/api-v1/deno.json supabase/functions/api-v1/index.ts
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run audit
      - run: npm run security:scan
      - run: npm run licenses:check
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  install-smoke:
    name: Clean install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: project-s-ci-public-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Cross-platform install smoke
        run: npm run test:install-smoke
      - name: Local setup failure and preservation checks
        run: npm run test:setup
      - name: Runnable example transport and registry checks
        run: npm run test:examples
      - name: Verify installation and checks preserve the source checkout
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --summary
            exit 1
          fi

  database:
    name: Reproducible database and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Bootstrap a fresh disposable local stack
        run: npm run bootstrap -- --skip-install
      - name: Prove existing data refusal and reuse preservation
        run: node scripts/check-local-bootstrap.mjs
      - name: Prove real Auth-to-RPC reviewed profile controls on the verified bootstrap
        run: npm run test:authority:live
        env:
          PROJECT_S_DISPOSABLE_AUTHORITY_TEST: '1'
      - run: npm run db:reset
      - name: Prove a second clean reset
        run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:db
      - run: npm run test:concurrency
      - run: npm run types:check
      # Bootstrap generated .env.local. Keep these extra API calls on this
      # runner so their normal rate-limit buckets cannot affect browser tests.
      - name: Exercise runnable examples against the real local API
        run: npm run test:examples:live
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  e2e:
    name: Browser and accessibility
    needs: [quality, database]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:env
      - run: npm run test:agent-flow
      - run: npm run test:e2e:install
      - run: npm run test:browser:body-limits
      - run: npm run test:built-app
      - name: Run every browser project with an isolated disposable database
        shell: bash
        run: |
          failed=0
          for browser in chromium firefox webkit; do
            # This job owns a fresh local-only stack. Keep normal abuse limits
            # intact and isolate each browser's synthetic bookings and quotas.
            npm run db:reset
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$browser" \
              npm run test:e2e -- --project="$browser" --output="test-results/$browser" || failed=1
          done
          exit "$failed"
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
