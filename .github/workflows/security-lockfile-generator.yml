name: One-off security lockfile generation

on:
  push:
    branches: [maintenance/security-lockfile-generator-20260910]

# Only the final step uses the ephemeral token, to store a Git blob.
# This workflow never updates branches, opens PRs, or changes main.
permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'EP2-Git/project-s' && github.actor == 'EP2-Git' && github.ref == 'refs/heads/maintenance/security-lockfile-generator-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EP2-Git/project-s
          ref: a4e8165dfd8fc0032e5b460d846ea45926f9fe82
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate and validate only the two patched lockfile records
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const expected = {
            'node_modules/js-yaml': ['4.3.1', '4.3.2'],
            'node_modules/postcss-selector-parser': ['6.1.2', '6.1.4'],
          };
          assert.equal(execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), '10.9.2');
          const before = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          execFileSync('npm', ['update', 'js-yaml', 'postcss-selector-parser', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], { stdio: 'inherit' });
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const changed = [...new Set([...Object.keys(before.packages), ...Object.keys(after.packages)])].filter((p) => JSON.stringify(before.packages[p]) !== JSON.stringify(after.packages[p]));
          console.log('Changed lockfile records:', JSON.stringify(changed));
          assert.deepEqual(changed.sort(), Object.keys(expected).sort(), 'Unexpected dependency changes');
          for (const [path, [from, to]] of Object.entries(expected)) {
            assert.equal(before.packages[path].version, from);
            assert.equal(after.packages[path].version, to);
            const name = path.slice('node_modules/'.length);
            const response = await fetch(`https://registry.npmjs.org/${name}/${to}`);
            assert.equal(response.status, 200);
            const metadata = await response.json();
            assert.equal(after.packages[path].resolved, metadata.dist.tarball);
            assert.equal(after.packages[path].integrity, metadata.dist.integrity);
            assert.match(after.packages[path].resolved, /^https:\/\/registry\.npmjs\.org\//);
            assert.match(after.packages[path].integrity, /^sha512-/);
            const oldOther = { ...before.packages[path] };
            const newOther = { ...after.packages[path] };
            for (const key of ['version', 'resolved', 'integrity']) { delete oldOther[key]; delete newOther[key]; }
            assert.deepEqual(newOther, oldOther, `Unexpected metadata/dependency changes for ${name}`);
            after.packages[path] = before.packages[path];
            console.log(`${name}: ${from} -> ${to}; registry tarball and integrity verified`);
          }
          assert.deepEqual(after, before, 'Unexpected lockfile metadata changes');
          assert.equal(execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim(), 'package-lock.json');
          execFileSync('git', ['diff', '--check'], { stdio: 'inherit' });
          execFileSync('git', ['diff', '--', 'package-lock.json'], { stdio: 'inherit' });
          execFileSync('npm', ['audit', '--package-lock-only', '--audit-level=high'], { stdio: 'inherit' });
          execFileSync('npm', ['audit', '--package-lock-only', '--omit=dev', '--audit-level=high'], { stdio: 'inherit' });
          const blob = execFileSync('git', ['hash-object', 'package-lock.json'], { encoding: 'utf8' }).trim();
          writeFileSync(`${process.env.RUNNER_TEMP}/validated-lock-blob`, blob);
          console.log(`VALIDATED_LOCKFILE_BLOB=${blob}`);
          NODE
      - name: Store validated lockfile as a Git blob without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const content = readFileSync('package-lock.json');
          const expected = readFileSync(`${process.env.RUNNER_TEMP}/validated-lock-blob`, 'utf8').trim();
          const actual = createHash('sha1').update(`blob ${content.length}\0`).update(content).digest('hex');
          assert.equal(actual, expected);
          const response = await fetch('https://api.github.com/repos/EP2-Git/project-s/git/blobs', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ content: content.toString('base64'), encoding: 'base64' }),
          });
          if (!response.ok) throw new Error(`Git blob creation failed: ${response.status}`);
          const blob = await response.json();
          assert.equal(blob.sha, expected);
          console.log(`GENERATED_LOCKFILE_BLOB=${blob.sha}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Validated npm-generated security lockfile blob: \`${blob.sha}\`. No branch refs were changed.\n`);
          NODE
